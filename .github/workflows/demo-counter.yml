
name: Update Demo Visitor Counter

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: write

concurrency:
  group: demo-counter
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Demo Counter
        shell: bash
        run: |
          mkdir -p assets

          if [ ! -f demo-count.txt ]; then
            echo 684 > demo-count.txt
          fi

          current=$(cat demo-count.txt)

          if ! [[ "$current" =~ ^[0-9]+$ ]]; then
            echo "Invalid counter value"
            exit 1
          fi

          increment=$((16 + RANDOM % 5))
          updated=$((current + increment))

          echo "$updated" > demo-count.txt

          cat > assets/demo-visits.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="420" height="110" viewBox="0 0 420 110">
            <rect width="420" height="110" rx="14" fill="#080808"/>
            <rect x="1" y="1" width="418" height="108" rx="13" fill="none" stroke="#D6B66F"/>
            <text x="24" y="36" fill="#D6B66F" font-family="Arial" font-size="12" letter-spacing="2">PROFILE VISITS</text>
            <text x="24" y="78" fill="#FFFFFF" font-family="Arial" font-size="34" font-weight="bold">$updated</text>
            <text x="390" y="76" fill="#D6B66F" font-family="Arial" font-size="12" text-anchor="end">LIVE DEMO</text>
          </svg>
          EOF

          echo "Previous count: $current"
          echo "Added visits: $increment"
          echo "New count: $updated"

      - name: Commit Counter Changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add demo-count.txt assets/demo-visits.svg

          if git diff --cached --quiet; then
            echo "No changes found"
            exit 0
          fi

          git commit -m "Update demo visitor counter"
          git push origin HEAD:main
